[project]
name = "first-data-en-project"
version = "0.1.0"
description = "First Data Engineering Project - Weather Data Pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.112",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
